<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 위시리스트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#eceef1;--sf:#fff;--ink:#16181d;--mute:#6b7280;--line:#dcdfe4;--acc:#3b3fd8;--on:#fff;--warn:#b7791f;--ph:#e4e6ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--sf:#1a1d23;--ink:#eef0f3;--mute:#9aa1ad;--line:#2a2e36;--acc:#8d90ff;--on:#101216;--warn:#e0b04c;--ph:#242830}}
:root[data-theme="dark"]{--bg:#101216;--sf:#1a1d23;--ink:#eef0f3;--mute:#9aa1ad;--line:#2a2e36;--acc:#8d90ff;--on:#101216;--warn:#e0b04c;--ph:#242830}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "IBM Plex Sans KR",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 96px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.sub{color:var(--mute);font-size:13px;margin-top:4px}
.add{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--acc);color:var(--on);font-size:28px;line-height:1}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;gap:20px;margin:14px 0 16px;border-bottom:1px solid var(--line)}
.seg button{border:0;background:none;padding:8px 0;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.seg button[aria-selected="true"]{color:var(--ink);font-weight:700;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}.card{min-width:0}
.card{border:0;background:none;padding:0;text-align:left;display:block;width:100%}
.ph img,.big img,.pick img{width:100%;height:100%;display:block;border-radius:10px}.ph img{object-fit:cover;object-position:center 30%}.big img,.pick img{object-fit:contain}.ph{aspect-ratio:4/5;border-radius:10px;background:var(--ph);overflow:hidden;position:relative;display:grid;place-items:center;color:var(--mute);font-size:13px}
.tag{position:absolute;left:8px;bottom:8px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--sf);color:var(--ink)}
.tag.want{background:var(--acc);color:var(--on)}.tag.think{color:var(--warn)}
.nm{margin-top:8px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr{color:var(--mute);font-size:14px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:64px 0}
.empty button{margin-top:12px;border:0;background:var(--acc);color:var(--on);padding:10px 18px;border-radius:999px}
dialog{border:0;border-radius:16px;padding:0;background:var(--sf);color:var(--ink);width:min(440px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.pad{padding:18px}
.big{aspect-ratio:1/1;border-radius:10px;background:var(--ph)}
.dn{font-size:22px;font-weight:700;margin:14px 0 2px;letter-spacing:-.01em}
.dp{font-size:18px}
.meta{color:var(--mute);font-size:13px;margin:4px 0 14px}
.btn{display:block;width:100%;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:10px;padding:12px;text-align:center;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.stat button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 4px}
.stat button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc);color:var(--on);font-weight:500}
.lbl{font-size:13px;color:var(--mute);margin:0 0 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
form label{display:block;margin-top:14px;font-size:13px;color:var(--mute)}
form input[type=text],form input[type=number],form input[type=url]{width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.pick{position:relative;margin-top:4px;border:1.5px dashed var(--line);border-radius:10px;aspect-ratio:16/9;background:var(--ph);display:grid;place-items:center;color:var(--mute);overflow:hidden}.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.pick img[hidden],[hidden]{display:none!important}.scan.off{opacity:.5}.scan{position:relative;overflow:hidden;margin-top:14px}.scan input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}#pasteTxt{width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);resize:vertical;font:inherit;color:inherit}.br{margin-top:8px;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.br+.nm{margin-top:0}.dbr{margin-top:14px;font-size:13px;font-weight:700;color:var(--mute)}.dbr+.dn{margin-top:2px}.err{color:#d33;font-size:13px;min-height:18px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>내 위시리스트</h1><div class="sub" id="count"></div></div>
    <button class="add" id="addBtn" aria-label="상품 등록">+</button>
  </header>
  <div class="row" id="cats" role="group" aria-label="카테고리"></div>
  <div class="seg" role="tablist">
    <button role="tab" id="tabActive" aria-selected="true">위시리스트</button>
    <button role="tab" id="tabOff" aria-selected="false">관심 없음</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<dialog id="detail"><div class="pad" id="detailBody"></div></dialog>

<dialog id="formDlg">
  <form class="pad" id="form" autocomplete="off">
    <p class="lbl" id="formTitle" style="font-size:16px;color:var(--ink);font-weight:700;margin:0"></p>
    <p class="lbl" style="margin:14px 0 0">상품 이미지</p>
    <div class="pick" id="pick"><span id="pickTxt">사진 선택</span><img id="pickImg" alt="" hidden><input type="file" id="file" accept="image/*" aria-label="상품 이미지 선택"></div>
    <label>브랜드명<input type="text" id="fBrand" maxlength="40"></label>
    <label>상품명<input type="text" id="fName" required maxlength="60"></label>
    <label>가격(원)<input type="number" id="fPrice" required min="0" inputmode="numeric"></label>
    <label>판매 링크<input type="url" id="fLink" placeholder="https://"></label>
    <label>카테고리</label>
    <div class="row" id="fCats" style="flex-wrap:wrap"></div>
    <div class="err" id="err"></div>
    <div class="two">
      <button type="button" class="btn ghost" id="cancel">취소</button>
      <button type="submit" class="btn">저장</button>
    </div>
  </form>
</dialog>

<script>
const CATS=['의류','가방','신발','뷰티','기타'];
const ST=[['want','사고 싶음'],['think','고민됨'],['off','관심 없음']];
const KEY='wishlist.v1';
let items=[],cat='전체',tab='active',editId=null,fCat='의류',fImg='',curId=null;
let col=null,dbState='wait';
try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){alert('저장 공간이 부족해요. 일부 상품을 삭제한 뒤 다시 시도해 주세요.')}}
async function putItem(i,withImg){
  if(!col){saveLocal();return}
  try{
    const m=Object.assign({},i);delete m.img;m.kind='item';
    await col.doc('i_'+i.id).set(m);
    if(withImg){
      if(i.img)await col.doc('g_'+i.id).set({kind:'img',id:i.id,data:i.img});
      else await col.doc('g_'+i.id).delete();
    }
  }catch(e){alert('저장하지 못했어요. 잠시 후 다시 시도해 주세요.')}
}
async function delItem(id){
  if(!col){saveLocal();return}
  try{await col.doc('i_'+id).delete();await col.doc('g_'+id).delete()}catch(e){alert('삭제하지 못했어요. 잠시 후 다시 시도해 주세요.')}
}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>Number(n).toLocaleString('ko-KR')+'원';
const stName=k=>ST.find(s=>s[0]===k)[1];
const dstr=t=>{const d=new Date(t);return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')};
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';

function render(){
  const act=items.filter(i=>i.status!=='off'), off=items.filter(i=>i.status==='off');
  $('count').textContent=`저장한 상품 ${act.length}개`+'';
  $('tabActive').setAttribute('aria-selected',tab==='active');
  $('tabOff').setAttribute('aria-selected',tab==='off');
  $('tabOff').textContent=`관심 없음${off.length?' '+off.length:''}`;
  $('cats').innerHTML=['전체',...CATS].map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join('');
  const base=tab==='active'?act:off;
  const list=base.filter(i=>cat==='전체'||i.cat===cat).sort((a,b)=>b.date-a.date);
  if(!list.length){
    $('grid').innerHTML=`<div class="empty">${tab==='off'?'관심 없음으로 옮긴 상품이 여기에 모여요.':items.length?'이 카테고리에 저장한 상품이 없어요.':'사고 싶은 상품을 저장해 보세요.'}${!items.length?'<br><button id="emptyAdd">첫 상품 등록</button>':''}</div>`;
    return;
  }
  $('grid').innerHTML=list.map(i=>`<button class="card" data-id="${i.id}"><div class="ph">${i.img?`<img src="${i.img}" alt="">`:'이미지 없음'}${tab==='active'&&i.status!=='want'?`<span class="tag ${i.status}">${stName(i.status)}</span>`:tab==='active'?`<span class="tag want">사고 싶음</span>`:''}</div>${i.brand?`<div class="br">${esc(i.brand)}</div>`:''}<div class="nm">${esc(i.name)}</div><div class="pr">${won(i.price)}</div></button>`).join('');
}

function openDetail(id){
  const i=items.find(x=>x.id===id); if(!i)return; curId=id;
  const u=safeUrl(i.link);
  $('detailBody').innerHTML=`<div class="big">${i.img?`<img src="${i.img}" alt="">`:''}</div>
  ${i.brand?`<div class="dbr">${esc(i.brand)}</div>`:''}<div class="dn">${esc(i.name)}</div><div class="dp">${won(i.price)}</div>
  <div class="meta">${esc(i.cat)} · 등록일 ${dstr(i.date)}</div>
  ${u?`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener noreferrer">판매 페이지로 이동</a>`:'<div class="meta">등록된 판매 링크가 없어요.</div>'}
  <p class="lbl" style="margin-top:16px">현재 상태</p>
  <div class="stat">${ST.map(s=>`<button data-s="${s[0]}" aria-pressed="${i.status===s[0]}">${s[1]}</button>`).join('')}</div>
  <div class="two"><button class="btn ghost" id="edit">수정</button><button class="btn ghost" id="del">삭제</button></div>
  <button class="btn ghost" id="close" style="margin-top:8px;border:0">닫기</button>`;
  if(!$('detail').open)$('detail').showModal();
}

function drawFCats(){$('fCats').innerHTML=CATS.map(c=>`<button type="button" class="chip" aria-pressed="${c===fCat}" data-c="${c}">${c}</button>`).join('')}
function setPick(){$('pickImg').hidden=!fImg;if(fImg)$('pickImg').src=fImg;$('pickTxt').hidden=!!fImg}
function openForm(id){
  editId=id||null;const i=id&&items.find(x=>x.id===id);
  $('formTitle').textContent=i?'상품 수정':'상품 등록';
  $('fBrand').value=i?i.brand||'':'';$('fName').value=i?i.name:'';$('fPrice').value=i?i.price:'';$('fLink').value=i?i.link||'':'';
  fCat=i?i.cat:(cat!=='전체'?cat:'의류');fImg=i?i.img||'':'';
  $('err').textContent='';$('file').value='';drawFCats();setPick();
  if($('detail').open)$('detail').close();
  $('formDlg').showModal();
}
function enc(im,m){
  const k=Math.min(1,m/Math.max(im.width,im.height));
  const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  let q=.82,u=c.toDataURL('image/jpeg',q);
  while(u.length>120000&&q>.45){q-=.08;u=c.toDataURL('image/jpeg',q)}
  return u;
}
function shrink(file){
  return new Promise((ok,no)=>{
    const r=new FileReader();
    r.onerror=no;
    r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{
      let m=1200,u=enc(im,m);
      while(u.length>120000&&m>300){m=Math.round(m*.8);u=enc(im,m)}
      ok(u);
    };im.src=r.result};
    r.readAsDataURL(file);
  });
}

$('addBtn').onclick=()=>openForm();
$('cats').onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;render()}};
$('tabActive').onclick=()=>{tab='active';render()};
$('tabOff').onclick=()=>{tab='off';render()};
$('grid').onclick=e=>{
  if(e.target.id==='emptyAdd')return openForm();
  const b=e.target.closest('.card');if(b)openDetail(b.dataset.id);
};
$('detailBody').onclick=e=>{
  const t=e.target,i=items.find(x=>x.id===curId);
  if(t.dataset.s&&i){i.status=t.dataset.s;putItem(i);render();openDetail(curId)}
  else if(t.id==='edit')openForm(curId);
  else if(t.id==='del'&&confirm('이 상품을 삭제할까요? 삭제하면 되돌릴 수 없어요.')){const did=curId;items=items.filter(x=>x.id!==did);delItem(did);$('detail').close();render()}
  else if(t.id==='close')$('detail').close();
};
$('fCats').onclick=e=>{const c=e.target.dataset.c;if(c){fCat=c;drawFCats()}};
$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{fImg=await shrink(f);$('err').textContent='';setPick()}catch(x){$('err').textContent='이미지를 불러오지 못했어요. 다른 사진을 선택해 주세요.'}
};
$('cancel').onclick=()=>$('formDlg').close();
$('form').onsubmit=e=>{
  e.preventDefault();
  const brand=$('fBrand').value.trim(),name=$('fName').value.trim(),price=Number($('fPrice').value),link=$('fLink').value.trim();
  if(!name){$('err').textContent='상품명을 입력해 주세요.';return}
  if(link&&!safeUrl(link)){$('err').textContent='링크는 http:// 또는 https://로 시작해야 해요.';return}
  let it;
  if(editId){it=items.find(x=>x.id===editId);Object.assign(it,{brand,name,price,link,cat:fCat,img:fImg})}
  else{it={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),brand,name,price,link,cat:fCat,img:fImg,status:'want',date:Date.now()};items.push(it)}
  putItem(it,true);$('formDlg').close();render();
  if(editId)openDetail(editId);
};
dbState='off';render();
</script>
</body>
</html>
